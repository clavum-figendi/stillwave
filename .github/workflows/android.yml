name: Android APK
on:
  push:
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify included offline web bundle
        run: |
          npm ci --prefix tests
          npm --prefix tests run check:build
          node --test tests/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'
      - name: Decode signing key outside source
        env:
          KEYSTORE_B64: ${{ secrets.STILLWAVE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STILLWAVE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.STILLWAVE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" || { printf '%s\n' 'All STILLWAVE signing secrets are required in CI.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/stillwave-release.jks"
      - name: Test, lint and build signed release plus emulator APKs
        working-directory: android
        env:
          STILLWAVE_KEYSTORE: ${{ runner.temp }}/stillwave-release.jks
          STILLWAVE_STORE_PASSWORD: ${{ secrets.STILLWAVE_STORE_PASSWORD }}
          STILLWAVE_KEY_PASSWORD: ${{ secrets.STILLWAVE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:coreTest :app:test :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify release APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: stillwave-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: stillwave-emulator-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-reports
          path: android/app/build/reports/
          retention-days: 7
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/stillwave-release.jks"
  offline-emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: stillwave-emulator-apks
          path: emulator-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold first launch in airplane mode and native playback lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash android/ci-offline-test.sh "$GITHUB_WORKSPACE/emulator-apks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-emulator-api-${{ matrix.api }}
          path: android/build/offline-test/
          retention-days: 14
