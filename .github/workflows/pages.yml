name: Publish web app
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify included offline web bundle
        run: |
          npm ci --prefix tests
          npm --prefix tests run check:build
          node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify browser audio, controls and offline operation
        run: |
          python -m pip install playwright==1.64.0
          # Hosted image already has the headless browser libraries; avoid apt
          # mirror/DNS stalls and download only the Chromium headless shell.
          python -m playwright install chromium --only-shell
          python tests/browser_test.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
